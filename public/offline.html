<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <title>Offline — Friends Expense Tracker</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #f1f5f9;
        }
        .card {
          background: #0f172a !important;
          border-color: #1e293b !important;
        }
        .muted {
          color: #94a3b8 !important;
        }
        .btn-secondary {
          background: #1e293b !important;
          color: #e2e8f0 !important;
          border-color: #334155 !important;
        }
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 10px 25px -10px rgba(15, 23, 42, 0.12);
      }
      .icon-wrap {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #ecfdf5;
        color: #059669;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.55;
      }
      .muted {
        color: #475569;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button,
      a.btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        border: none;
      }
      .btn-primary {
        background: #059669;
        color: #ffffff;
      }
      .btn-primary:hover {
        background: #047857;
      }
      .btn-secondary {
        background: #f8fafc;
        color: #334155;
        border: 1px solid #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon-wrap" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" y1="2" x2="22" y2="22" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>You're currently offline</h1>
      <p class="muted">
        Friends Expense Tracker couldn't reach the network for this page. Reconnect to sync your latest group balances, friend requests, and receipts.
      </p>
      <div class="actions">
        <button class="btn-primary" type="button" onclick="window.location.reload()">
          Try Reconnecting
        </button>
        <a class="btn-secondary" href="/">
          Open Cached Ledger
        </a>
      </div>
    </main>
    <script>
      window.addEventListener('online', function () {
        window.location.replace('/');
      });
    </script>
  </body>
</html>
